<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>어디가수? — 대중교통 하차 알림</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg" />

<!-- PWA: 홈 화면 설치 + 전체화면 실행 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#F4B23E" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- iOS Safari: 홈 화면에 추가 시 전체화면 앱처럼 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="어디가수" />
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
    background:#F4EEE3; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #root { height:100%; }
  button { font-family:inherit; }
  ::-webkit-scrollbar { width:0; height:0; }

  .ag-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  @keyframes ag-sheet-up { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .ag-sheet { animation:ag-sheet-up .42s cubic-bezier(.16,1,.3,1); }

  @keyframes ag-ping { 0% { transform:scale(0.6); opacity:0.6; } 80%,100% { transform:scale(1.9); opacity:0; } }
  .ag-ping { animation:ag-ping 1.6s ease-out infinite; }

  @keyframes ag-bell { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-16deg); } 40% { transform:rotate(13deg); } 60% { transform:rotate(-8deg); } 80% { transform:rotate(4deg); } }
  .ag-bell { animation:ag-bell .9s ease-in-out infinite; transform-origin:50% 12%; }

  @keyframes ag-flash { 0%,100% { background:#D8392C; } 50% { background:#B22A1F; } }
  .ag-flash { animation:ag-flash .7s ease-in-out infinite; }

  @keyframes ag-spin { to { transform:rotate(360deg); } }
  .ag-spin { animation:ag-spin .9s linear infinite; }

  @keyframes ag-pop { 0% { transform:scale(0); } 60% { transform:scale(1.15); } 100% { transform:scale(1); } }
  .ag-pop { animation:ag-pop .5s cubic-bezier(.16,1,.3,1); }

  @media (prefers-reduced-motion: reduce) {
    .ag-bell, .ag-flash, .ag-ping { animation:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/regionart.jsx"></script>
<script type="text/babel" src="app/geo.jsx"></script>
<script type="text/babel" src="app/api.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/screens.jsx"></script>
<script type="text/babel" src="app/navigation.jsx"></script>
<script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
